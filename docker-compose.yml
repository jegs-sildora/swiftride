version: "3.8"

# ===========================================================
# SwiftRide ERP — Docker Compose Orchestration
# Single PostgreSQL instance shared by all 5 microservices.
# Each service uses its own database within the one Postgres.
# + React/Vite frontend
# ===========================================================

networks:
  swiftride_network:
    driver: bridge

volumes:
  postgres_data:

services:
  # ===========================================================
  # DATABASE LAYER — single PostgreSQL instance
  # All 5 microservices connect to this one container.
  # The init script creates each service's own database.
  # ===========================================================

  postgres:
    image: postgres:16-alpine
    container_name: swiftride_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: swiftride_gateway_db
      POSTGRES_USER: ${DB_USER:-swiftride}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - swiftride_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-swiftride}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================
  # SERVICE LAYER — 5 Laravel microservices
  # Services communicate via Docker's internal DNS.
  # No service accesses another service's database directly.
  # ===========================================================

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: swiftride_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "SwiftRide Gateway"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${GATEWAY_APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${GATEWAY_APP_URL:-http://localhost:8000}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: swiftride_gateway_db
      DB_USERNAME: ${DB_USER:-swiftride}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Internal service URLs resolved via Docker DNS
      FLEET_SERVICE_URL: http://fleet:8001
      CRM_SERVICE_URL: http://crm:8002
      BOOKING_SERVICE_URL: http://booking:8003
      BILLING_SERVICE_URL: http://billing:8004
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swiftride_network

  fleet:
    build:
      context: ./fleet
      dockerfile: Dockerfile
    container_name: swiftride_fleet
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      APP_NAME: "SwiftRide Fleet"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${FLEET_APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${FLEET_APP_URL:-http://localhost:8001}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: swiftride_fleet_db
      DB_USERNAME: ${DB_USER:-swiftride}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swiftride_network

  crm:
    build:
      context: ./crm
      dockerfile: Dockerfile
    container_name: swiftride_crm
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      APP_NAME: "SwiftRide CRM"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${CRM_APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${CRM_APP_URL:-http://localhost:8002}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: swiftride_crm_db
      DB_USERNAME: ${DB_USER:-swiftride}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swiftride_network

  booking:
    build:
      context: ./booking
      dockerfile: Dockerfile
    container_name: swiftride_booking
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      APP_NAME: "SwiftRide Booking"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${BOOKING_APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${BOOKING_APP_URL:-http://localhost:8003}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: swiftride_booking_db
      DB_USERNAME: ${DB_USER:-swiftride}
      DB_PASSWORD: ${DB_PASSWORD}
      # Downstream service URLs for inter-service calls (Http facade)
      FLEET_SERVICE_URL: http://fleet:8001
      CRM_SERVICE_URL: http://crm:8002
    depends_on:
      postgres:
        condition: service_healthy
      fleet:
        condition: service_started
      crm:
        condition: service_started
    networks:
      - swiftride_network

  billing:
    build:
      context: ./billing
      dockerfile: Dockerfile
    container_name: swiftride_billing
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      APP_NAME: "SwiftRide Billing"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${BILLING_APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${BILLING_APP_URL:-http://localhost:8004}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: swiftride_billing_db
      DB_USERNAME: ${DB_USER:-swiftride}
      DB_PASSWORD: ${DB_PASSWORD}
      BOOKING_SERVICE_URL: http://booking:8003
    depends_on:
      postgres:
        condition: service_healthy
      booking:
        condition: service_started
    networks:
      - swiftride_network

  # ===========================================================
  # PRESENTATION LAYER — React/Vite SPA served via nginx
  # ===========================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swiftride_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://localhost:8000/api}
    depends_on:
      - gateway
    networks:
      - swiftride_network
