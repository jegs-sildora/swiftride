version: "3.8"

# ===========================================================
# SwiftRide ERP — Docker Compose Orchestration
# Each microservice uses its own dedicated PostgreSQL instance.
# + React/Vite frontend
# ===========================================================

networks:
  swiftride_network:
    driver: bridge

services:

  # ===========================================================
  # DATABASE LAYER
  # ===========================================================

  postgres:
    image: postgres:16-alpine
    container_name: swiftride_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: swiftride
      POSTGRES_PASSWORD: swiftride
      POSTGRES_DB: swiftride
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - swiftride_network

  # ===========================================================
  # SERVICE LAYER — Laravel microservices
  # ===========================================================

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: swiftride_auth
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      APP_NAME: "SwiftRide Auth"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${AUTH_APP_KEY:-base64:3p+H+2XyWcK/4O4W/1qVvT9zI3/M3v8V+V0jB+YV+f8=}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${AUTH_APP_URL:-http://localhost:8005}
      DB_CONNECTION: pgsql
      DB_URL: ${AUTH_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - swiftride_network
    develop:
      watch:
        - action: sync
          path: ./auth
          target: /var/www/html
          ignore:
            - vendor/

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: swiftride_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "SwiftRide Gateway"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${GATEWAY_APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${GATEWAY_APP_URL:-http://localhost:8000}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth:8000
      FLEET_SERVICE_URL: http://fleet:8001
      CRM_SERVICE_URL: http://crm:8002
      BOOKING_SERVICE_URL: http://booking:8003
      BILLING_SERVICE_URL: http://billing:8004
    networks:
      - swiftride_network
    develop:
      watch:
        - action: sync
          path: ./gateway
          target: /var/www/html
          ignore:
            - vendor/

  fleet:
    build:
      context: ./fleet
      dockerfile: Dockerfile
    container_name: swiftride_fleet
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      APP_NAME: "SwiftRide Fleet"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${FLEET_APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${FLEET_APP_URL:-http://localhost:8001}
      DB_CONNECTION: pgsql
      DB_URL: ${FLEET_DATABASE_URL}
    networks:
      - swiftride_network
    develop:
      watch:
        - action: sync
          path: ./fleet
          target: /var/www/html
          ignore:
            - vendor/

  crm:
    build:
      context: ./crm
      dockerfile: Dockerfile
    container_name: swiftride_crm
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      APP_NAME: "SwiftRide CRM"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${CRM_APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${CRM_APP_URL:-http://localhost:8002}
      DB_CONNECTION: pgsql
      DB_URL: ${CRM_DATABASE_URL}
    networks:
      - swiftride_network
    develop:
      watch:
        - action: sync
          path: ./crm
          target: /var/www/html
          ignore:
            - vendor/

  booking:
    build:
      context: ./booking
      dockerfile: Dockerfile
    container_name: swiftride_booking
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      APP_NAME: "SwiftRide Booking"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${BOOKING_APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${BOOKING_APP_URL:-http://localhost:8003}
      DB_CONNECTION: pgsql
      DB_URL: ${BOOKING_DATABASE_URL}
      FLEET_SERVICE_URL: http://fleet:8001
      CRM_SERVICE_URL: http://crm:8002
    networks:
      - swiftride_network
    develop:
      watch:
        - action: sync
          path: ./booking
          target: /var/www/html
          ignore:
            - vendor/

  billing:
    build:
      context: ./billing
      dockerfile: Dockerfile
    container_name: swiftride_billing
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      APP_NAME: "SwiftRide Billing"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${BILLING_APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${BILLING_APP_URL:-http://localhost:8004}
      DB_CONNECTION: pgsql
      DB_URL: ${BILLING_DATABASE_URL}
      BOOKING_SERVICE_URL: http://booking:8003
    networks:
      - swiftride_network
    develop:
      watch:
        - action: sync
          path: ./billing
          target: /var/www/html
          ignore:
            - vendor/

  # ===========================================================
  # PRESENTATION LAYER — React/Vite SPA served via nginx
  # ===========================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swiftride_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://localhost:8000/api}
    depends_on:
      - gateway
    networks:
      - swiftride_network
    develop:
      watch:
        - action: rebuild
          path: ./frontend/src

volumes:
  postgres_data:
