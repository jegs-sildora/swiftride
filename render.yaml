services:

  # ── Auth Microservice (Private) ──────────────────────────────────────────
  - type: web
    plan: free
    name: auth
    env: docker
    dockerContext: ./auth
    dockerfilePath: ./auth/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_qY9iI0yalXzB@ep-sweet-wind-aqp2o8vv.c-8.us-east-1.aws.neon.tech/swiftride_auth_db?sslmode=require

  # ── API Gateway Service (Public) ──────────────────────────────────────────
  - type: web
    name: gateway
    plan: free
    env: docker
    dockerContext: ./gateway
    dockerfilePath: ./gateway/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: JWT_SECRET
        fromService:
          type: web
          name: auth
          envVarKey: JWT_SECRET
      - key: AUTH_SERVICE_URL
        value: http://auth:8000
      - key: FLEET_SERVICE_URL
        value: http://fleet:8001
      - key: CRM_SERVICE_URL
        value: http://crm:8002
      - key: BOOKING_SERVICE_URL
        value: http://booking:8003
      - key: BILLING_SERVICE_URL
        value: http://billing:8004

  # ── Fleet Microservice (Private) ─────────────────────────────────────────
  - type: web
    plan: free
    name: fleet
    env: docker
    dockerContext: ./fleet
    dockerfilePath: ./fleet/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_qY9iI0yalXzB@ep-sweet-wind-aqp2o8vv.c-8.us-east-1.aws.neon.tech/swiftride_fleet_db?sslmode=require

  # ── CRM Microservice (Private) ───────────────────────────────────────────
  - type: web
    plan: free
    name: crm
    env: docker
    dockerContext: ./crm
    dockerfilePath: ./crm/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_qY9iI0yalXzB@ep-sweet-wind-aqp2o8vv.c-8.us-east-1.aws.neon.tech/swiftride_crm_db?sslmode=require

  # ── Booking Microservice (Private) ───────────────────────────────────────
  - type: web
    plan: free
    name: booking
    env: docker
    dockerContext: ./booking
    dockerfilePath: ./booking/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_qY9iI0yalXzB@ep-sweet-wind-aqp2o8vv.c-8.us-east-1.aws.neon.tech/swiftride_booking_db?sslmode=require
      - key: FLEET_SERVICE_URL
        value: http://fleet:8001
      - key: CRM_SERVICE_URL
        value: http://crm:8002
      - key: BILLING_SERVICE_URL
        value: http://billing:8004

  # ── Billing Microservice (Private) ───────────────────────────────────────
  - type: web
    plan: free
    name: billing
    env: docker
    dockerContext: ./billing
    dockerfilePath: ./billing/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_qY9iI0yalXzB@ep-sweet-wind-aqp2o8vv.c-8.us-east-1.aws.neon.tech/swiftride_billing_db?sslmode=require
      - key: BOOKING_SERVICE_URL
        value: http://booking:8003

  # ── React Frontend Service (Public) ───────────────────────────────────────
  - type: web
    name: frontend
    plan: free
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile

    envVars:
      - key: GATEWAY_HOST
        fromService:
          type: web
          name: gateway
          property: host
