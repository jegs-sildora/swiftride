services:

  # ── Auth Microservice (Private) ──────────────────────────────────────────
  - type: private
    name: auth
    env: docker
    dockercontext: ./auth
    dockerfilepath: ./auth/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false

  # ── API Gateway Service (Public) ──────────────────────────────────────────
  - type: web
    name: gateway
    plan: free
    env: docker
    dockercontext: ./gateway
    dockerfilepath: ./gateway/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: JWT_SECRET
        fromService:
          name: auth
          envVarKey: JWT_SECRET
      - key: AUTH_SERVICE_URL
        value: http://auth:8000
      - key: FLEET_SERVICE_URL
        value: http://fleet:8001
      - key: CRM_SERVICE_URL
        value: http://crm:8002
      - key: BOOKING_SERVICE_URL
        value: http://booking:8003
      - key: BILLING_SERVICE_URL
        value: http://billing:8004

  # ── Fleet Microservice (Private) ─────────────────────────────────────────
  - type: private
    name: fleet
    env: docker
    dockercontext: ./fleet
    dockerfilepath: ./fleet/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false

  # ── CRM Microservice (Private) ───────────────────────────────────────────
  - type: private
    name: crm
    env: docker
    dockercontext: ./crm
    dockerfilepath: ./crm/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false

  # ── Booking Microservice (Private) ───────────────────────────────────────
  - type: private
    name: booking
    env: docker
    dockercontext: ./booking
    dockerfilepath: ./booking/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false
      - key: FLEET_SERVICE_URL
        value: http://fleet:8001
      - key: CRM_SERVICE_URL
        value: http://crm:8002
      - key: BILLING_SERVICE_URL
        value: http://billing:8004

  # ── Billing Microservice (Private) ───────────────────────────────────────
  - type: private
    name: billing
    env: docker
    dockercontext: ./billing
    dockerfilepath: ./billing/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false
      - key: BOOKING_SERVICE_URL
        value: http://booking:8003

  # ── React Frontend Service (Public) ───────────────────────────────────────
  - type: web
    name: frontend
    plan: free
    env: docker
    dockercontext: ./frontend
    dockerfilepath: ./frontend/Dockerfile
    dockerBuildArgs:
      VITE_API_GATEWAY_URL: ${gateway.url}
    envVars:
      - key: VITE_API_GATEWAY_URL
        fromService:
          name: gateway
          property: url
