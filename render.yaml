        value: base64:5ZaZykrMggdGqiAh9ssJz8pmNIXeXQSo1GuwTEVqRSo=
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        value: postgresql://neondb_owner:npg_qY9iI0yalXzB@ep-sweet-wind-aqp2o8vv.c-8.us-east-1.aws.neon.tech/swiftride_fleet_db?sslmode=require

