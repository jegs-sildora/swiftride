services:

  # ── Auth Microservice (Private) ──────────────────────────────────────────
  - type: web
    plan: free
    name: auth
    env: docker
    dockerContext: ./auth
    dockerfilePath: ./auth/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: base64:J9o8uL3sN7kG2rW1yQ6xP5tE4mA0hD9cF8bV7nZ3eXw=
      - key: JWT_SECRET
        value: base64:kL9sM2nW7yR4tX1qP5vC6jD8hF3mB0zG7xN4cV9bE2a=
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        value: postgresql://neondb_owner:npg_qY9iI0yalXzB@ep-sweet-wind-aqp2o8vv.c-8.us-east-1.aws.neon.tech/swiftride_auth_db?sslmode=require

  # ── API Gateway Service (Public) ──────────────────────────────────────────
  - type: web
    name: gateway
    plan: free
    env: docker
    dockerContext: ./gateway
    dockerfilePath: ./gateway/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: base64:/0BMvvQ7EOI6wnn16i2e7TmzKF2CL2h8GknF6ipg66g=
      - key: JWT_SECRET
        fromService:
          type: web
          name: auth
          envVarKey: JWT_SECRET
      - key: AUTH_SERVICE_URL
        value: http://auth:8000
      - key: FLEET_SERVICE_URL
        value: http://fleet:8001
      - key: CRM_SERVICE_URL
        value: http://crm:8002
      - key: BOOKING_SERVICE_URL
        value: http://booking:8003
      - key: BILLING_SERVICE_URL
        value: http://billing:8004

